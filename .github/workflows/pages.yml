name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Build installable PWA
        run: npm run build:pages --prefix frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PWA_API_BASE_URL }}

      - name: Add SPA fallback
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          mkdir -p frontend/dist/instalacja
          cp frontend/dist/index.html frontend/dist/instalacja/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
